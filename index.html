<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyeux anniversaire</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="scene">
    <h1 class="typewriter"><span id="typed"></span><span class="cursor">|</span></h1>
    <button id="open-btn" class="open-btn" type="button">Ouvrir</button>
  </main>

  <!-- Ciel qui s'étend depuis le bouton, avec le feu d'artifice et le décor -->
  <div id="night" class="night">
    <!-- Soleil : placé avant le reste pour passer derrière les montagnes, le feu d'artifice et le décor -->
    <div id="sun" class="sun"></div>
    <canvas id="fireworks"></canvas>
    <!-- Montagnes blanches en bas de l'écran : une chaîne lointaine estompée, une chaîne proche pleine -->
    <svg id="mountains" class="mountains" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">
      <path class="far" d="M0,200 L0,120 L60,90 L120,110 L190,50 L250,95 L320,70 L400,20 L470,85 L540,60 L610,100 L680,40 L750,90 L820,65 L900,30 L960,80 L1000,70 L1000,200 Z"/>
      <path class="near" d="M0,200 L0,150 L80,120 L150,140 L230,95 L300,135 L360,118 L420,108 L580,104 L640,128 L670,120 L740,155 L820,110 L880,135 L940,100 L1000,130 L1000,200 Z"/>
    </svg>
    <!-- Silhouettes noires dans la neige : lui, elle (main dans la main) et le chat -->
    <svg id="family" class="family" viewBox="0 0 160 120" aria-hidden="true">
      <g class="limbs">
        <path d="M61,35 L74,64"/>
        <path d="M89,38 L74,64"/>
        <path d="M39,35 L33,66"/>
        <path d="M101,38 L107,64"/>
        <path d="M141,117 Q155,114 151,100"/>
      </g>
      <circle cx="50" cy="18" r="9"/>
      <path d="M38,32 Q50,27 62,32 L64,72 L58,72 L57,120 L51,120 L50,78 L49,120 L43,120 L42,72 L36,72 Z"/>
      <path d="M87,26 Q85,40 89,46 L101,46 Q105,40 103,26 Z"/>
      <circle cx="95" cy="24" r="8"/>
      <path d="M88,36 Q95,32 102,36 L104,62 L112,94 L78,94 L86,62 Z"/>
      <rect x="89" y="94" width="4" height="26"/>
      <rect x="97" y="94" width="4" height="26"/>
      <path d="M125,120 Q122,100 132,96 Q142,100 140,120 Z"/>
      <circle cx="132" cy="90" r="6"/>
      <path d="M126.5,88 L127.5,79 L132,85 Z"/>
      <path d="M132,85 L136.5,79 L137.5,88 Z"/>
    </svg>
    <!-- Baleine blanche à gauche, au-dessus des montagnes -->
    <svg id="whale" class="whale" viewBox="0 0 300 150" aria-hidden="true">
      <path d="M290,95 C290,60 240,40 190,42 C140,44 100,60 60,78 L35,60 C30,45 15,35 0,30 C10,45 20,60 30,75 C15,78 5,88 0,100 C20,98 40,95 58,92 C100,115 160,125 220,120 C260,117 290,110 290,95 Z"/>
      <path d="M180,115 C170,135 150,145 135,140 C150,130 160,120 165,112 Z"/>
      <circle class="eye" cx="255" cy="85" r="3"/>
    </svg>
    <!-- Palmier blanc en haut à droite, dont le tronc sort du bord de l'écran -->
    <svg id="palm" class="palm" viewBox="0 0 220 200" aria-hidden="true">
      <path d="M220,196 C176,186 132,134 104,70 L116,66 C142,124 180,166 220,174 Z"/>
      <path d="M110,66 C80,40 40,45 8,85 C45,64 80,64 110,74 Z"/>
      <path d="M110,66 C95,30 70,10 32,6 C64,24 88,45 106,72 Z"/>
      <path d="M110,66 C126,30 152,14 190,14 C158,30 136,50 114,72 Z"/>
      <path d="M110,66 C146,50 184,66 204,104 C174,82 142,74 112,74 Z"/>
      <path d="M108,70 C80,76 56,102 46,140 C66,108 88,90 110,78 Z"/>
      <path d="M112,70 C140,80 162,106 168,144 C152,112 134,94 110,80 Z"/>
    </svg>
    <img id="photo" class="photo" alt="">
    <p id="memory" class="memory"></p>
    <div id="finale" class="finale">
      <h2 class="finale-title"><span id="finale-text"></span><span class="cursor">|</span></h2>
      <p id="countdown" class="countdown"></p>
    </div>
    <button id="skip-btn" class="skip-btn" type="button">Passer à la fin ⏭</button>
  </div>

  <audio id="song" src="song/BEN%20plg%20-%20Chanson%20damour%20(prod.%20Lucci%20%26%20Murer).mp3" preload="auto"></audio>

  <script src="js/fireworks.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
